name: Deploy to Production

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. SSHキーを設定
      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          name: id_rsa
          known_hosts: ${{ secrets.SSH_HOST }}

      # 3. リモートサーバーにSSH接続してgit pullを実行
      - name: Pull latest code from git repository
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'cd /home/ordermade/yakyumare-be && git pull origin production'

      # 4. キャッシュ関連の処理
      - name: Clear cache and optimize
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'cd /home/ordermade/yakyumare-be && php artisan cache:clear && php artisan config:cache && php artisan route:cache'

      # 5. マイグレーションがあれば実行
      - name: Run migrations if available
        if: ${{ steps.migrations_check.outputs.migrations == 'true' }}
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'cd /home/ordermade/yakyumare-be && php artisan migrate --force'
